<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PAATHU RUN</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8ed8f2;font-family:system-ui,Arial;color:white;touch-action:none}
#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
#hud{display:none;position:fixed;top:env(safe-area-inset-top,10px);left:0;right:0;justify-content:space-between;padding:14px 18px;pointer-events:none;text-shadow:0 2px 5px #000}
.pill{background:#06150fc9;border:1px solid #ffffff35;border-radius:18px;padding:7px 13px;font-weight:800}
#title{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#172b3a22,#172b3a55);text-align:center;cursor:pointer}
.panel{width:min(92vw,440px);padding:20px 12px;background:transparent;border:0;box-shadow:none}
h1{font-size:clamp(46px,13vw,76px);line-height:1;margin:0;color:#fff36b;letter-spacing:1px;-webkit-text-stroke:2px #7138a0;text-shadow:0 5px 0 #7138a0,0 9px 18px #182b4c99}
.sub{color:#fff;margin:20px 0 0;font-size:19px;font-weight:900;letter-spacing:3px;text-shadow:0 3px 8px #32204f}
button{border:0;border-radius:16px;background:#a9e85e;color:#14200d;font-weight:900;font-size:18px;padding:14px 24px;box-shadow:0 5px 0 #5d9632}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #5d9632}
#help{display:none}
#controls{display:none!important;position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:0;right:0;justify-content:space-between;padding:0 16px;pointer-events:none}
.pad{display:flex;gap:8px;pointer-events:auto}
.pad button{width:55px;height:52px;padding:0;background:#10251dd9;color:white;border:1px solid #ffffff45;box-shadow:none;font-size:23px}
#toast{position:fixed;top:22%;left:0;right:0;text-align:center;font-weight:900;font-size:22px;text-shadow:0 3px 8px #000;pointer-events:none;opacity:0}
#shopOpen{position:fixed;right:14px;top:calc(72px + env(safe-area-inset-top,0px));z-index:20;padding:9px 13px;font-size:14px;border-radius:14px;box-shadow:0 3px 0 #5d9632}
#shopModal{display:none;position:fixed;inset:0;z-index:30;align-items:center;justify-content:center;background:#06150fc9;padding:20px}
.shopCard{width:min(92vw,360px);padding:24px 20px;border-radius:24px;background:linear-gradient(160deg,#315f3c,#183b30);border:2px solid #b7e58a;text-align:center;box-shadow:0 15px 50px #0008}
.shopCard h2{margin:0 0 8px;color:#fff2a1;font-size:25px}
.shopBalance{font-weight:900;font-size:18px;margin:10px 0 20px}
.shopItem{display:flex;align-items:center;justify-content:center;gap:18px;padding:16px;margin-bottom:16px;border-radius:16px;background:#ffffff18;text-align:left}
.hatPreview{font-size:48px;line-height:1}
.shopItem strong,.shopItem small{display:block}.shopItem small{opacity:.85;margin-top:4px}
.shopCard button{width:100%;margin:5px 0}
.shopCard .shopClose{background:#e7eee2;box-shadow:0 4px 0 #9aa99a}
.shopNote{display:block;opacity:.8;margin-top:10px}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud"><div class="pill">🐐 PAATHU RUN</div><div class="pill">🪙 <span id="coins">0</span>　🏃 <span id="score">0</span>m</div></div>
<div id="toast">NICE!</div>
<div id="title"><div class="panel">
  <div style="font-size:clamp(76px,20vw,112px);filter:drop-shadow(0 8px 8px #44205b66)">🐐</div>
  <h1>PAATHU RUN</h1>
  <div class="sub" id="titleSub">TAP TO PLAY</div>
</div></div>
<button id="shopOpen" aria-label="Open shop">🎅 SHOP</button>
<div id="shopModal">
 <div class="shopCard">
  <h2>🎄 FOREST SHOP</h2>
  <div class="shopBalance">🪙 <span id="shopCoins">0</span> coins</div>
  <div class="shopItem">
   <div class="hatPreview">🎅</div>
   <div><strong>Christmas Hat</strong><small>For Paathu • 500 coins</small></div>
  </div>
  <button id="hatAction">BUY • 500 🪙</button>
  <button id="shopClose" class="shopClose">CLOSE</button>
  <small class="shopNote">Coins and your hat are saved on this device.</small>
 </div>
</div>
<div id="controls">
 <div class="pad"><button data-move="left">◀</button><button data-move="right">▶</button></div>
 <div class="pad"><button data-move="jump">⬆</button><button data-move="slide">⬇</button></div>
</div>
<script type="importmap">

</script>
<script type="module">
import * as THREE from 'three';

const mount=document.getElementById('game');
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x83d7f4); scene.fog=new THREE.Fog(0x83d7f4,48,145);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,150); camera.position.set(0,5.0,11.5); camera.lookAt(0,1.15,-6);
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,1.35)); renderer.setSize(innerWidth,innerHeight); renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap; renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.12; mount.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe5ffff,0x34402b,2.0));
const sun=new THREE.DirectionalLight(0xfff1d0,2.8); sun.position.set(-5,12,7); sun.castShadow=true; sun.shadow.mapSize.set(1536,1536); scene.add(sun);
const mat=(color,roughness=.85)=>new THREE.MeshStandardMaterial({color,roughness});
const green=mat(0x54a94c), darkGreen=mat(0x287344), stone=mat(0xa99b82), paleStone=mat(0xd4c6a5), gold=mat(0xffcf42,.38), purple=mat(0xa94be8), lightPurple=mat(0xd58aff), pink=mat(0xffa9ce), white=mat(0xfff8fb), black=mat(0x24152e), hoof=mat(0x49334b), horn=mat(0xc58a4c), mouth=mat(0x7b3650);
const box=(w,h,d,m,x,y,z)=>{let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o};
const sphere=(r,m,x,y,z,sx=1,sy=1,sz=1)=>{let o=new THREE.Mesh(new THREE.SphereGeometry(r,16,12),m);o.position.set(x,y,z);o.scale.set(sx,sy,sz);o.castShadow=true;scene.add(o);return o};
const cyl=(rt,rb,h,m,x,y,z,seg=10)=>{let o=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),m);o.position.set(x,y,z);o.castShadow=true;scene.add(o);return o};

// PAATHU FOREST: a winding-looking woodland trail with distant mountain ranges.
scene.background=new THREE.Color(0x9bdcf4);
scene.fog=new THREE.Fog(0x9bdcf4,58,165);
const ground=box(180,.7,145,mat(0x4b914b),0,-.55,-48);
const forestFloor=box(34,.12,145,mat(0x5eaa55),0,-.13,-48);
// Soft dirt running path, with grassy shoulders.
const path=box(7.5,.16,145,mat(0xb58b59),0,-.02,-48);
const pathEdgeMat=mat(0x80613f);
box(.16,.08,145,pathEdgeMat,-3.82,.055,-48);
box(.16,.08,145,pathEdgeMat,3.82,.055,-48);
// Distant mountain layers: broad overlapping peaks create a scenic horizon.
const mountainMats=[mat(0x789b9c),mat(0x668b83),mat(0x557b70),mat(0x8ca9a4)];
for(let i=0;i<13;i++){
 const x=-65+i*10.8, h=17+(i%4)*5, r=13+(i%3)*3;
 const peak=new THREE.Mesh(new THREE.ConeGeometry(r,h,5),mountainMats[i%mountainMats.length]);
 peak.position.set(x,h*.42,-91-(i%3)*8);peak.rotation.y=(i%2)*.4;scene.add(peak);
 // Pale rocky cap on taller distant peaks.
 if(h>27){const cap=new THREE.Mesh(new THREE.ConeGeometry(r*.32,h*.25,5),mat(0xe2eee8));cap.position.set(x,h*.82,-91-(i%3)*8);scene.add(cap);}
}
// Forested foothills in front of the mountains.
for(let i=0;i<17;i++){
 const hill=new THREE.Mesh(new THREE.SphereGeometry(1,16,12),mat(i%2?0x4b8757:0x60935b));
 hill.scale.set(9+(i%3)*3,5+(i%4),5);hill.position.set(-72+i*9,1.2,-62-(i%3)*5);scene.add(hill);
}
// Pine tree builder; each tree is a grouped trunk and layered green canopy.
const roadsideProps=[];
const pineMats=[mat(0x174f35),mat(0x206b3d),mat(0x2c8248),mat(0x3a9250)];
const trunkMat=mat(0x765039), rockMats=[mat(0x777d70),mat(0x929487),mat(0x665f54)];
function makePine(group,height,variant=0){
 const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.13,.22,height*.48,7),trunkMat);
 trunk.position.y=height*.24;group.add(trunk);
 for(let k=0;k<3;k++){
   const radius=height*(.31-k*.055), tierH=height*.48;
   const crown=new THREE.Mesh(new THREE.ConeGeometry(radius,tierH,7),pineMats[(variant+k)%pineMats.length]);
   crown.position.y=height*.38+k*height*.22;group.add(crown);
 }
}
for(let side of [-1,1]){
 for(let i=0;i<13;i++){
   const group=new THREE.Group(),z=-i*10-8;
   const x=side*(7.2+(i%3)*2.0);
   group.position.set(x,0,z);
   const h=5.5+(i%4)*1.35;makePine(group,h,i);
   // A smaller companion pine makes the forest feel dense, not like a row of props.
   const small=new THREE.Group();small.position.set(side*-2.0,0,1.8);makePine(small,h*.62,i+1);group.add(small);
   const rock=new THREE.Mesh(new THREE.DodecahedronGeometry(.7+(i%3)*.18,0),rockMats[i%rockMats.length]);
   rock.position.set(side*1.4,.35,-1.1);rock.scale.set(1.3,.7,1);group.add(rock);
   scene.add(group);roadsideProps.push({group,initialZ:z,phase:i*.5+side});
 }
}
// Small trail stones and tufts scroll toward the runner.
const trackScroll=[];
for(let z=5;z>-122;z-=4.5){
 const stone=new THREE.Mesh(new THREE.DodecahedronGeometry(.11,0),mat(0x8c765a));
 stone.position.set((Math.random()-.5)*5.8,.09,z);stone.scale.set(1.5,.45,.8);scene.add(stone);trackScroll.push(stone);
}
const laneDashes=[];
for(let z=4;z>-112;z-=7){
 const dash=new THREE.Group();dash.position.z=z;
 for(let x of [-1.55,1.55]){
   const tuft=new THREE.Mesh(new THREE.ConeGeometry(.12,.34,5),pineMats[2]);
   tuft.position.set(x,.18,0);dash.add(tuft);
 }
 scene.add(dash);laneDashes.push(dash);
}
// Open sky and soft clouds above the mountain ridge.
const overhead=[];
const clouds=[];
for(let i=0;i<5;i++){
 const cloud=new THREE.Group();cloud.position.set((i%2?1:-1)*(13+(i%3)*7),13+(i%2)*2,-38-i*19);
 for(let j=0;j<5;j++){
   const puff=new THREE.Mesh(new THREE.SphereGeometry(1.15,12,10),new THREE.MeshBasicMaterial({color:0xffffff}));
   puff.position.set((j-2)*.85,(j%2)*.28,0);puff.scale.set(1.25,.72,.9);cloud.add(puff);
 }
 scene.add(cloud);clouds.push(cloud);
}
// Paathu: use a real, lightweight rigged goat model instead of the old pile of spheres.
const goat=new THREE.Group(); scene.add(goat); goat.position.set(0,0,3);
const goatModelRoot=new THREE.Group();goat.add(goatModelRoot);
const christmasHat=new THREE.Group();
const hatBrim=new THREE.Mesh(new THREE.CylinderGeometry(.43,.43,.12,20),mat(0xf6f2e8));
hatBrim.position.y=2.43;christmasHat.add(hatBrim);
const hatCone=new THREE.Mesh(new THREE.ConeGeometry(.34,.78,16),mat(0xc92f3b));
hatCone.position.set(0,2.84,-.04);hatCone.rotation.z=-.12;christmasHat.add(hatCone);
const hatPom=new THREE.Mesh(new THREE.SphereGeometry(.13,12,10),mat(0xffffff));
hatPom.position.set(-.06,3.24,-.04);christmasHat.add(hatPom);
christmasHat.position.set(0,-.30,-.55);christmasHat.visible=false;goatModelRoot.add(christmasHat);
let goatMixer=null, goatModel=null, goatLegNodes=[], goatPartsByName={};
const head=new THREE.Group(), tail=new THREE.Group(), legs=[];
const goatLoader=new GLTFLoader();
goatLoader.load(
 'https://polyfork.dev/cdn/goat-base.glb',
 (gltf)=>{
   goatModel=gltf.scene;
   // The asset is authored in metres; size it to match the runner's lane scale.
   goatModel.scale.setScalar(1.42);
   goatModel.rotation.y=Math.PI;
   goatModel.position.set(0,0,0);
   goatModel.traverse((node)=>{
     if(!node.isMesh)return;
     node.castShadow=true;node.receiveShadow=true;
     const mats=Array.isArray(node.material)?node.material:[node.material];
     for(const material of mats){
       if(!material)continue;
       const label=((node.name||'')+' '+(material.name||'')).toLowerCase();
       // Keep horns, hooves, eyes and muzzle natural; recolour only coat/fur/body materials.
       if(material.color){
         // The free goat model uses one shared palette material; tint it toward Paathu purple.
         material.color.set(0xb34be8);
         material.needsUpdate=true;
       }
     }
     if(/FrontUpLeg|FrontLeg|HindUpLeg|HindLeg/.test(node.name||''))goatLegNodes.push(node);
     if(node.name)goatPartsByName[node.name]=node;
   });
   goatModelRoot.add(goatModel);
   if(gltf.animations && gltf.animations.length){
     goatMixer=new THREE.AnimationMixer(goatModel);
     gltf.animations.forEach(clip=>goatMixer.clipAction(clip).play());
   }
 },
 undefined,
 (error)=>{
   console.warn('Paathu goat model could not load; using simple fallback.',error);
   const fallbackBody=new THREE.Mesh(new THREE.SphereGeometry(.72,24,18),purple);
   fallbackBody.position.set(0,1.05,0);fallbackBody.scale.set(1,.9,1.25);fallbackBody.castShadow=true;goatModelRoot.add(fallbackBody);
   const fallbackHead=new THREE.Mesh(new THREE.SphereGeometry(.53,24,18),lightPurple);
   fallbackHead.position.set(0,2,-.62);fallbackHead.castShadow=true;goatModelRoot.add(fallbackHead);
   for(const x of [-.25,.25]){
     const eye=new THREE.Mesh(new THREE.SphereGeometry(.12,16,12),white);eye.position.set(x,2.08,-1.08);goatModelRoot.add(eye);
     const pupil=new THREE.Mesh(new THREE.SphereGeometry(.06,12,10),black);pupil.position.set(x,2.08,-1.14);goatModelRoot.add(pupil);
     const ear=new THREE.Mesh(new THREE.SphereGeometry(.2,14,10),pink);ear.position.set(x*2,2,-.55);ear.scale.set(1.5,.45,.55);goatModelRoot.add(ear);
     const horn=new THREE.Mesh(new THREE.ConeGeometry(.12,.55,12),mat(0xc58a4c));horn.position.set(x*.9,2.65,-.48);horn.rotation.z=x<0?.25:-.25;goatModelRoot.add(horn);
   }
 }
);
// The forest hunter: a stylised, non-graphic pursuer who appears in the opening.
const hunter=new THREE.Group();hunter.position.set(0,0,7.1);hunter.scale.setScalar(.92);scene.add(hunter);
const hunterCloth=mat(0x554335),hunterDark=mat(0x292d2c),hunterSkin=mat(0xc58e68),hunterLeather=mat(0x805a35);
const hBody=new THREE.Mesh(new THREE.CapsuleGeometry(.42,.95,5,9),hunterCloth);hBody.position.y=1.12;hunter.add(hBody);
const hHead=new THREE.Mesh(new THREE.SphereGeometry(.34,14,12),hunterSkin);hHead.position.set(0,2.02,0);hunter.add(hHead);
const hood=new THREE.Mesh(new THREE.SphereGeometry(.4,14,12),hunterDark);hood.scale.set(1.08,1.05,.95);hood.position.set(0,2.15,-.08);hunter.add(hood);
const faceCover=new THREE.Mesh(new THREE.BoxGeometry(.42,.19,.08),hunterLeather);faceCover.position.set(0,1.94,.3);hunter.add(faceCover);
for(let x of [-.17,.17]){
 const eye=new THREE.Mesh(new THREE.SphereGeometry(.045,8,8),mat(0xffd47a));eye.position.set(x,2.05,.34);hunter.add(eye);
 const leg=new THREE.Mesh(new THREE.CapsuleGeometry(.13,.62,4,7),hunterDark);leg.position.set(x, .38,0);hunter.add(leg);
 const arm=new THREE.Mesh(new THREE.CapsuleGeometry(.11,.55,4,7),hunterCloth);arm.position.set(x*2,1.25,.04);arm.rotation.z=x<0?-.25:.25;hunter.add(arm);
}
const pack=new THREE.Mesh(new THREE.BoxGeometry(.55,.68,.28),hunterLeather);pack.position.set(0,1.25,-.34);hunter.add(pack);
hunter.visible=false;
// track decoration pool
let moving=[];
function addObstacle(lane,z,type){
 let g=new THREE.Group();g.position.set([-1.5,0,1.5][lane],0,z);scene.add(g);g.userData={type,lane,hit:false};
 if(type==='rock'){
   let o=new THREE.Mesh(new THREE.DodecahedronGeometry(.48,1),stone);o.position.y=.48;o.scale.set(1,.9,.75);o.castShadow=true;g.add(o);
 }
 if(type==='log'){
   let o=new THREE.Mesh(new THREE.CylinderGeometry(.32,.32,1.18,12),mat(0x80502d));o.rotation.z=Math.PI/2;o.position.y=.7;o.castShadow=true;g.add(o);
   for(let x of [-.38,.38]){let ring=new THREE.Mesh(new THREE.CylinderGeometry(.34,.34,.08,12),mat(0xc99b62));ring.rotation.z=Math.PI/2;ring.position.set(x,.7,0);g.add(ring)}
 }
 if(type==='crate'){
   const wood=mat(0xb8793d), trim=mat(0xf0c16a);
   let c=new THREE.Mesh(new THREE.BoxGeometry(1.05,1.05,.9),wood);c.position.y=.55;c.castShadow=true;g.add(c);
   for(let y of [.18,.9]){let plank=new THREE.Mesh(new THREE.BoxGeometry(1.09,.12,.94),trim);plank.position.y=y;g.add(plank)}
   let slash=new THREE.Mesh(new THREE.BoxGeometry(1.12,.12,.98),trim);slash.position.y=.55;slash.rotation.z=.72;g.add(slash);
 }
 if(type==='puddle'){
   let p=new THREE.Mesh(new THREE.CylinderGeometry(.62,.62,.035,24),mat(0x55cbe8,.25));p.position.y=.025;p.scale.z=1.2;g.add(p);
   let glint=new THREE.Mesh(new THREE.SphereGeometry(.12,12,8),mat(0xd9fbff,.2));glint.scale.set(1,.12,.55);glint.position.set(-.2,.06,.05);g.add(glint);
   // Splash droplets make the hazard easy to spot.
   for(let x of [-.38,.34]){let d=new THREE.Mesh(new THREE.SphereGeometry(.09,10,8),mat(0x9cecff));d.position.set(x,.14,0);g.add(d)}
 }
 if(type==='branch'){
   const bark=mat(0x754629),leaf=mat(0x4a9c45);
   let b=new THREE.Mesh(new THREE.CylinderGeometry(.16,.2,2.25,10),bark);b.rotation.z=Math.PI/2;b.position.y=1.75;b.castShadow=true;g.add(b);
   for(let x of [-.62,0,.62]){let tuft=new THREE.Mesh(new THREE.SphereGeometry(.28,12,10),leaf);tuft.position.set(x,1.88,0);tuft.scale.set(1,.75,1);g.add(tuft)}
 }
 if(type==='stump'){
   let st=new THREE.Mesh(new THREE.CylinderGeometry(.42,.5,.85,12),mat(0x88552f));st.position.y=.42;st.castShadow=true;g.add(st);
   let top=new THREE.Mesh(new THREE.CylinderGeometry(.43,.43,.08,12),mat(0xd2a36b));top.position.y=.86;g.add(top);
 }
 if(type==='fallen_branch'){
   const bark=mat(0x79502f),leaf=mat(0x3e9148);
   const log=new THREE.Mesh(new THREE.CylinderGeometry(.22,.28,1.22,10),bark);log.rotation.z=Math.PI/2;log.position.y=.28;g.add(log);
   for(let x of [-.35,.05,.38]){const twig=new THREE.Mesh(new THREE.CylinderGeometry(.07,.1,.8,7),bark);twig.position.set(x,.55,0);twig.rotation.z=x*.8;g.add(twig)}
 }
 if(type==='mushrooms'){
   for(let x of [-.42,0,.42]){
     const stem=new THREE.Mesh(new THREE.CylinderGeometry(.07,.09,.28,8),mat(0xf1e8d2));stem.position.set(x,.14,0);g.add(stem);
     const cap=new THREE.Mesh(new THREE.SphereGeometry(.2,10,8),mat(x===0?0xe64d48:0xe8a84c));cap.scale.y=.55;cap.position.set(x,.31,0);g.add(cap);
   }
 }
 if(type==='boulder'){
   const b=new THREE.Mesh(new THREE.DodecahedronGeometry(.9,1),mat(0x777d78));b.position.y=.82;b.scale.set(1.1,1,.85);g.add(b);
 }
 if(type==='roots'){
   for(let x of [-.65,-.2,.25,.65]){
     const root=new THREE.Mesh(new THREE.CylinderGeometry(.13,.2,1.15,7),mat(0x78502e));root.rotation.z=Math.PI/2+(Math.random()-.5)*.4;root.position.set(x,.28,0);g.add(root);
   }
 }
 if(type==='water'){
   // Decorative, safe shallow stream crossing: it never triggers a collision.
   const water=new THREE.Mesh(new THREE.CircleGeometry(1.18,28),new THREE.MeshStandardMaterial({color:0x58c9e8,roughness:.2,metalness:.08,transparent:true,opacity:.82}));
   water.rotation.x=-Math.PI/2;water.scale.set(1.3,.7,1);water.position.y=.055;g.add(water);
   for(let i=0;i<3;i++){
     const ripple=new THREE.Mesh(new THREE.TorusGeometry(.35+i*.2,.018,6,24),new THREE.MeshBasicMaterial({color:0xd8fbff,transparent:true,opacity:.7}));
     ripple.rotation.x=-Math.PI/2;ripple.position.y=.075+i*.002;g.add(ripple);
   }
 }
 if(type==='giant_boulder'){
   const rockMat=mat(0x777e79),highlight=mat(0xa4aaa0);
   const b=new THREE.Mesh(new THREE.DodecahedronGeometry(.62,1),rockMat);
   b.position.y=.62;b.scale.set(1.0,1.0,.9);b.castShadow=true;g.add(b);
   const chip=new THREE.Mesh(new THREE.DodecahedronGeometry(.32,0),highlight);
   chip.position.set(-.28,1.05,.18);chip.scale.set(1,.65,.7);g.add(chip);
 }
 if(type==='fallen_tree'){
   const bark=mat(0x684126),cut=mat(0xd1a06a),leaves=mat(0x2e7e43);
   const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.36,.42,1.25,12),bark);
   trunk.rotation.z=Math.PI/2;trunk.position.y=.42;trunk.castShadow=true;g.add(trunk);
   for(let x of [-.55,.55]){
     const end=new THREE.Mesh(new THREE.CylinderGeometry(.37,.37,.09,12),cut);
     end.rotation.z=Math.PI/2;end.position.set(x,.42,0);g.add(end);
   }
   for(let x of [-.42,-.12,.22,.42]){
     const branch=new THREE.Mesh(new THREE.CylinderGeometry(.12,.18,1.25,8),bark);
     branch.position.set(x,.82,0);branch.rotation.z=(x%2?-.65:.65);g.add(branch);
     const crown=new THREE.Mesh(new THREE.SphereGeometry(.25,10,9),leaves);
     crown.position.set(x,1.12,0);crown.scale.set(1.25,.8,1);g.add(crown);
   }
 }
 if(type==='thorn_wall'){
   const bushMats=[mat(0x246b38),mat(0x388b45),mat(0x4d9c4d)];
   for(let i=0;i<7;i++){
     const bush=new THREE.Mesh(new THREE.IcosahedronGeometry(.25+(i%3)*.035,1),bushMats[i%3]);
     bush.position.set(-.48+i*.24,.48+(i%2)*.12,0);bush.scale.set(1,1.05,.9);g.add(bush);
   }
   const thorn=mat(0xd8d0a2);
   for(let i=0;i<6;i++){
     const spike=new THREE.Mesh(new THREE.ConeGeometry(.09,.42,5),thorn);
     spike.position.set(-.48+(i%3)*.48,.72+Math.floor(i/3)*.18,.12);spike.rotation.z=(i%2?-.5:.5);g.add(spike);
   }
 }
 if(type==='train'){
   const body=new THREE.Mesh(new THREE.BoxGeometry(1.45,2.7,2.5),mat(0x168eaa));
   body.position.set(0,1.35,0);body.castShadow=true;g.add(body);
   const windshield=new THREE.Mesh(new THREE.BoxGeometry(1.12,.72,.06),mat(0x9de7f3,.25));
   windshield.position.set(0,2.02,1.27);g.add(windshield);
   const stripe=new THREE.Mesh(new THREE.BoxGeometry(1.48,.22,2.52),mat(0xf3a34b));
   stripe.position.y=1.05;g.add(stripe);
   for(let x of [-.48,.48]){
     const lamp=new THREE.Mesh(new THREE.SphereGeometry(.12,12,10),new THREE.MeshBasicMaterial({color:0xfff4bf}));
     lamp.position.set(x,.55,1.29);g.add(lamp);
   }
 }
 moving.push(g);return g;
}
function addCoin(lane,z){let g=new THREE.Group();g.position.set([-1.5,0,1.5][lane],1.25,z);let c=new THREE.Mesh(new THREE.TorusGeometry(.28,.09,8,18),gold);c.rotation.y=Math.PI/2;g.add(c);let dot=new THREE.Mesh(new THREE.SphereGeometry(.1,8,8),mat(0xfff1a1));dot.position.z=.02;g.add(dot);g.userData={type:'coin',lane,hit:false};scene.add(g);moving.push(g)}
let saved={coins:0,hatOwned:false,hatEquipped:false};
try{
 const stored=localStorage.getItem('paathuRunSave');
 if(stored)saved={...saved,...JSON.parse(stored)};
}catch(e){console.warn('Could not read saved progress',e)}
let lane=1, laneLean=0, jumpY=0, jumpV=0, sliding=0, running=false, ended=false, score=0,coins=Math.max(0,Number(saved.coins)||0),speed=15,spawn=0,coinSpawn=0,last=0;
let hatOwned=!!saved.hatOwned,hatEquipped=!!saved.hatEquipped;
function saveProgress(){
 const data=JSON.stringify({coins,hatOwned,hatEquipped});
 try{localStorage.setItem('paathuRunSave',data);}
 catch(e){console.warn('Browser storage is unavailable; progress may not persist.',e)}
}
function refreshShop(){
 document.getElementById('coins').textContent=coins;
 document.getElementById('shopCoins').textContent=coins;
 christmasHat.visible=hatEquipped;
 const action=document.getElementById('hatAction');
 action.textContent=hatEquipped?'EQUIPPED ✓':(hatOwned?'EQUIP HAT':'BUY • 500 🪙');
 action.disabled=!hatOwned&&coins<500;
 action.style.opacity=action.disabled?'.55':'1';
}
const scoreEl=document.getElementById('score'),coinEl=document.getElementById('coins'),title=document.getElementById('title'),toast=document.getElementById('toast');
function say(t){toast.textContent=t;toast.style.opacity=1;clearTimeout(say.timer);say.timer=setTimeout(()=>toast.style.opacity=0,650)}
document.getElementById('shopOpen').addEventListener('click',()=>{
 if(running)running=false;
 refreshShop();document.getElementById('shopModal').style.display='flex';
});
document.getElementById('shopClose').addEventListener('click',()=>{
 document.getElementById('shopModal').style.display='none';
 if(!ended&&document.getElementById('title').style.display==='none'){running=true;last=performance.now();}
});
document.getElementById('hatAction').addEventListener('click',()=>{
 if(!hatOwned){
   if(coins<500)return;
   coins-=500;hatOwned=true;hatEquipped=true;
 }else hatEquipped=!hatEquipped;
 saveProgress();refreshShop();
});
function move(d){
 if(!running)return;
 if(d==='left'){const old=lane;lane=Math.max(0,lane-1);if(lane!==old)laneLean=-1;}
 if(d==='right'){const old=lane;lane=Math.min(2,lane+1);if(lane!==old)laneLean=1;}
 if(d==='jump'&&jumpY<.05&&sliding<=0)jumpV=8.7;
 if(d==='slide'&&jumpY<.15)sliding=.72;
}
refreshShop();
addEventListener('pagehide',saveProgress);
document.querySelectorAll('[data-move]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();move(b.dataset.move)}));
let sx=0,sy=0;renderer.domElement.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});
renderer.domElement.addEventListener('pointerup',e=>{let dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<22)return;if(Math.abs(dx)>Math.abs(dy))move(dx>0?'right':'left');else move(dy<0?'jump':'slide')});
addEventListener('keydown',e=>{if(['ArrowLeft','a','ArrowRight','d','ArrowUp','w',' ','ArrowDown','s'].includes(e.key)){e.preventDefault();move(({ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'jump',w:'jump',' ':'jump',ArrowDown:'slide',s:'slide'})[e.key])}});
function reset(){for(let o of moving)scene.remove(o);moving=[];roadsideProps.forEach(item=>{item.group.position.z=item.initialZ;});
 overhead.forEach(item=>{item.group.position.z=item.initialZ;});
 trackScroll.forEach((sleeper,i)=>{sleeper.position.z=5-i*3.5;});laneDashes.forEach((dash,i)=>{dash.position.z=4-i*5;});lane=1;laneLean=0;jumpY=0;jumpV=0;sliding=0;score=0;speed=15;spawn=1.35;coinSpawn=.8;ended=false;hunter.visible=false;hunter.position.set(0,0,7.1);hunterCooldown=18+Math.random()*7;hunterPhase='hidden';hunterPhaseTime=0;goat.position.y=0;goat.scale.y=1;scoreEl.textContent='0';refreshShop();title.querySelector('h1').textContent='PAATHU RUN';document.getElementById('titleSub').textContent='TAP TO PLAY';}
let hunterCooldown=19,hunterPhase='hidden',hunterPhaseTime=0;
function start(){
 reset();running=false;title.querySelector('h1').textContent='A QUIET FOREST...';
 document.getElementById('titleSub').textContent='Paathu wanders along a peaceful mountain trail.';
 hunter.visible=false;
 const started=performance.now();last=started;
 function reveal(now){
   if(title.style.display==='none')return;
   const elapsed=now-started;
   // Give each story beat enough time to read before changing the screen.
   if(elapsed<2700){
     title.querySelector('h1').textContent='A QUIET FOREST...';
     document.getElementById('titleSub').textContent='Paathu wanders along a peaceful mountain trail.';
     hunter.visible=false;
   }else if(elapsed<5600){
     title.querySelector('h1').textContent='A SNAP IN THE TREES!';
     document.getElementById('titleSub').textContent='Something is following Paathu through the forest...';
     hunter.visible=true;
     hunter.position.set(0,0,8.2-(elapsed-2700)*.00035);
     hunter.rotation.y=Math.sin(elapsed*.001)*.08;
   }else if(elapsed<7600){
     title.querySelector('h1').textContent='THE HUNTER!';
     document.getElementById('titleSub').textContent='Run, Paathu! Swipe to dodge, jump and slide.';
     hunter.visible=true;
     hunter.position.set(0,0,6.9);
   }else{
     hunter.visible=false;
     title.style.display='none';running=true;
     hunterCooldown=18+Math.random()*7;hunterPhase='hidden';hunterPhaseTime=0;
     document.getElementById('hud').style.display='flex';
     document.getElementById('controls').style.display='flex';
     last=performance.now();
     return;
   }
   requestAnimationFrame(reveal);
 }
 requestAnimationFrame(reveal);
}
title.addEventListener('pointerdown',()=>{if(!running)start()});

function crash(){running=false;ended=true;document.getElementById('hud').style.display='none';document.getElementById('controls').style.display='none';title.style.display='flex';title.querySelector('h1').textContent='GAME OVER';document.getElementById('titleSub').textContent=`${Math.floor(score)} m  •  ${coins} coins  •  TAP TO PLAY`;}
function animate(t){requestAnimationFrame(animate);let dt=Math.min((t-last)/1000||0,.04);last=t;
 if(running){
 // Road markings and scenery stream toward the goat to sell forward motion.
 for(const dash of laneDashes){dash.position.z+=speed*dt;if(dash.position.z>8)dash.position.z-=115;}
 for(const sleeper of trackScroll){sleeper.position.z+=speed*dt;if(sleeper.position.z>8)sleeper.position.z-=127;}
 for(const item of roadsideProps){item.group.position.z+=speed*dt;if(item.group.position.z>13)item.group.position.z-=120;}
 for(const item of overhead){item.group.position.z+=speed*dt;if(item.group.position.z>12)item.group.position.z-=128;}
 for(const cloud of clouds){cloud.position.x+=Math.sin(t*.00025+cloud.position.z)*dt*.08;}
 tail.rotation.x=Math.sin(t*.018)*.28;
 // The Hunter only appears briefly now and then, like a distant pursuer.
 // He runs into view, hangs back for a moment, then falls out of sight.
 if(hunterPhase==='hidden'){
   hunter.visible=false;hunterCooldown-=dt;
   if(hunterCooldown<=0){hunterPhase='enter';hunterPhaseTime=0;hunter.visible=true;hunter.position.set(goat.position.x*.5,0,12.5);}
 }else{
   hunterPhaseTime+=dt;
   hunter.visible=true;
   hunter.position.x=THREE.MathUtils.damp(hunter.position.x,goat.position.x*.55,2.5,dt);
   hunter.rotation.z=Math.sin(t*.014)*.045;
   if(hunterPhase==='enter'){
     hunter.position.z=THREE.MathUtils.damp(hunter.position.z,7.0,2.2,dt);
     if(hunterPhaseTime>2.2){hunterPhase='linger';hunterPhaseTime=0;}
   }else if(hunterPhase==='linger'){
     hunter.position.z=7.0+Math.sin(t*.009)*.12;
     if(hunterPhaseTime>1.6){hunterPhase='exit';hunterPhaseTime=0;}
   }else if(hunterPhase==='exit'){
     hunter.position.z=THREE.MathUtils.damp(hunter.position.z,13.5,2.6,dt);
     if(hunterPhaseTime>2.3){hunterPhase='hidden';hunter.visible=false;hunterCooldown=17+Math.random()*13;}
   }
 }
 if(goatMixer)goatMixer.update(dt);
 if(goatModel){
   goatModelRoot.position.y=Math.sin(t*.018)*.035;
   goatModelRoot.rotation.z=Math.sin(t*.006)*.012;
   const gait=Math.sin(t*.018);
   goatLegNodes.forEach((node,i)=>{node.rotation.x=gait*((i%2===0)?1:-1)*.28;});
   if(goatPartsByName.Head)goatPartsByName.Head.rotation.x=Math.sin(t*.012)*.035;
   if(goatPartsByName.Tail)goatPartsByName.Tail.rotation.x=Math.sin(t*.025)*.18;
   if(goatPartsByName.LeftEar)goatPartsByName.LeftEar.rotation.z=Math.sin(t*.02)*.07;
   if(goatPartsByName.RightEar)goatPartsByName.RightEar.rotation.z=-Math.sin(t*.02)*.07;
 }
 score+=dt*speed*.65;
 // Difficulty rises in clear 500m stages rather than accelerating constantly.
 const stage=Math.floor(score/300);
 speed=Math.min(27,15+stage*.8);
 scoreEl.textContent=Math.floor(score);
 goat.position.x=THREE.MathUtils.damp(goat.position.x,[-1.5,0,1.5][lane],16,dt);
 laneLean=THREE.MathUtils.damp(laneLean,0,5.5,dt);
 goat.rotation.z=THREE.MathUtils.damp(goat.rotation.z,-laneLean*.13,10,dt);
 goat.rotation.y=THREE.MathUtils.damp(goat.rotation.y,laneLean*.09,9,dt);
 camera.position.x=THREE.MathUtils.damp(camera.position.x,goat.position.x*.10,3,dt);
 camera.lookAt(goat.position.x*.06,1.15,-6);
 if(jumpV!==0||jumpY>0){jumpV-=20*dt;jumpY+=jumpV*dt;if(jumpY<=0){jumpY=0;jumpV=0;goat.scale.y=.88;}}
 goat.position.y=jumpY;
 sliding=Math.max(0,sliding-dt);
 const desiredScaleY=sliding>0?.62:(jumpY===0?1:1);
 goat.scale.y=THREE.MathUtils.damp(goat.scale.y,desiredScaleY,sliding>0?18:12,dt);
 goat.rotation.x=THREE.MathUtils.damp(goat.rotation.x,sliding>0?-.16:(jumpY>0?.08:0),10,dt);
 goat.position.z=3;
 
 spawn-=dt;coinSpawn-=dt;
 if(spawn<=0){let l=Math.floor(Math.random()*3),types=['rock','rock','log','crate','branch','stump','fallen_branch','mushrooms','boulder','roots','giant_boulder','fallen_tree','thorn_wall'];addObstacle(l,-75,types[Math.floor(Math.random()*types.length)]);spawn=Math.max(.92,1.48-(speed-15)*.025)}
 if(Math.random()<dt*.12){let wl=Math.floor(Math.random()*3);addObstacle(wl,-82,'water')}
 if(coinSpawn<=0){let l=Math.floor(Math.random()*3);for(let i=0;i<5;i++)addCoin(l,-55-i*2.4);coinSpawn=2.1+Math.random()*1.3}
 for(let i=moving.length-1;i>=0;i--){let o=moving[i];o.position.z+=speed*dt;if(o.userData.type==='coin')o.rotation.y+=dt*3;
 if(o.position.z>2.3&&!o.userData.hit){o.userData.hit=true;let same=Math.abs(goat.position.x-[-1.5,0,1.5][o.userData.lane])<.65;
 if(o.userData.type==='coin'){if(same&&Math.abs(o.position.z-3)<1.1){coins++;saveProgress();refreshShop();say('+1 🪙')}}else if(o.userData.type!=='water'&&same&&o.position.z>1.5&&o.position.z<4.5){let laneChangeOnly=['giant_boulder','fallen_tree','thorn_wall'].includes(o.userData.type);let safe=laneChangeOnly?false:(o.userData.type==='branch'?sliding>0:jumpY>(o.userData.type==='log'?.8:.75));if(!safe)crash();else say('DODGED!')}}
 if(o.position.z>9){scene.remove(o);moving.splice(i,1)}}
 }
 renderer.render(scene,camera);
}
requestAnimationFrame(animate);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>

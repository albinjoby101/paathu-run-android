<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PAATHU RUN</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8ed8f2;font-family:system-ui,Arial;color:white;touch-action:none}
#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
#hud{display:none;position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:0;right:0;z-index:24;align-items:center;justify-content:space-between;gap:7px;padding:0 10px;pointer-events:none;text-shadow:0 2px 5px #000}
#hud .pill{font-size:clamp(11px,3vw,14px);padding:7px 9px;white-space:nowrap}
#hudPlayer{max-width:36vw;overflow:hidden;text-overflow:ellipsis}
#pauseGameButton{pointer-events:auto;padding:7px 11px;font-size:14px;background:#183b30;color:#fff2a1;border:1px solid #b7e58a;box-shadow:0 3px 0 #10251d}
#pauseOverlay{display:none;position:fixed;inset:0;z-index:60;background:#06150fc9;align-items:center;justify-content:center;padding:24px;text-align:center}
#pauseOverlay .pause-card{width:min(90vw,340px);padding:26px 20px;border-radius:22px;background:#183b30;border:2px solid #b7e58a}
#pauseOverlay button{width:100%;margin-top:12px}
#storySkip{display:none;margin:20px auto 0;background:#183b30;color:#fff2a1;border:1px solid #b7e58a;box-shadow:0 4px 0 #10251d}
#title.story-mode .panel>div:first-child,#title.story-mode .menu-actions{display:none}
#title.story-mode #storySkip{display:block}
body.playing #paathuIdentity,body.playing #shopOpen,body.playing #settingsOpen,body.playing #accountOpen,body.playing #leaderboardOpen{display:none!important}
body.story-intro #accountOpen,body.story-intro #leaderboardOpen,body.story-intro #paathuIdentity,body.story-intro #shopOpen,body.story-intro #settingsOpen{display:none!important}
.pill{background:#06150fc9;border:1px solid #ffffff35;border-radius:18px;padding:7px 13px;font-weight:800}
#title{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#172b3a22,#172b3a55);text-align:center;cursor:pointer}
.panel{width:min(92vw,440px);padding:20px 12px;background:transparent;border:0;box-shadow:none}
h1{font-size:clamp(46px,13vw,76px);line-height:1;margin:0;color:#fff36b;letter-spacing:1px;-webkit-text-stroke:2px #7138a0;text-shadow:0 5px 0 #7138a0,0 9px 18px #182b4c99}
.sub{color:#fff;margin:20px 0 0;font-size:19px;font-weight:900;letter-spacing:3px;text-shadow:0 3px 8px #32204f}
button{border:0;border-radius:16px;background:#a9e85e;color:#14200d;font-weight:900;font-size:18px;padding:14px 24px;box-shadow:0 5px 0 #5d9632}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #5d9632}
#help{display:none}
#title .menu-actions{display:grid;gap:12px;width:min(82vw,300px);margin:22px auto 0}
#title .menu-actions button{width:100%;font-size:17px}
#title .menu-actions .menu-alt{background:#183b30;color:#fff2a1;box-shadow:0 5px 0 #10251d;border:1px solid #b7e58a}
#paathuIdentity{position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:25;display:none;background:#183b30dd;border:1px solid #b7e58a;border-radius:14px;padding:8px 11px;font-size:12px;font-weight:800;max-width:70vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#controls{display:none!important;position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:0;right:0;justify-content:space-between;padding:0 16px;pointer-events:none}
.pad{display:flex;gap:8px;pointer-events:auto}
.pad button{width:55px;height:52px;padding:0;background:#10251dd9;color:white;border:1px solid #ffffff45;box-shadow:none;font-size:23px}
#toast{position:fixed;top:22%;left:0;right:0;text-align:center;font-weight:900;font-size:22px;text-shadow:0 3px 8px #000;pointer-events:none;opacity:0}
#shopOpen{position:fixed;right:14px;top:calc(72px + env(safe-area-inset-top,0px));z-index:20;padding:9px 13px;font-size:14px;border-radius:14px;box-shadow:0 3px 0 #5d9632}
#shopModal{display:none;position:fixed;inset:0;z-index:30;align-items:center;justify-content:center;background:#06150fc9;padding:20px}
.shopCard{width:min(92vw,360px);padding:24px 20px;border-radius:24px;background:linear-gradient(160deg,#315f3c,#183b30);border:2px solid #b7e58a;text-align:center;box-shadow:0 15px 50px #0008}
.shopCard h2{margin:0 0 8px;color:#fff2a1;font-size:25px}
.shopBalance{font-weight:900;font-size:18px;margin:10px 0 20px}
.shopItem{display:flex;align-items:center;justify-content:center;gap:18px;padding:16px;margin-bottom:16px;border-radius:16px;background:#ffffff18;text-align:left}
.hatPreview{font-size:48px;line-height:1}
.shopItem strong,.shopItem small{display:block}.shopItem small{opacity:.85;margin-top:4px}
.shopCard button{width:100%;margin:5px 0}
.shopCard .shopClose{background:#e7eee2;box-shadow:0 4px 0 #9aa99a}
.shopNote{display:block;opacity:.8;margin-top:10px}

/* Settings and expanded shop */
#settingsOpen{position:fixed;left:14px;top:calc(72px + env(safe-area-inset-top,0px));z-index:20;padding:9px 13px;font-size:14px;border-radius:14px;box-shadow:0 3px 0 #5d9632}
#shopModal,#settingsModal{overflow-y:auto;overscroll-behavior:contain}
.shopCard{max-height:88vh;overflow-y:auto}
.shopItem{justify-content:space-between;gap:10px;margin-bottom:10px;padding:12px}
.shopItemInfo{display:flex;align-items:center;gap:13px;min-width:0}
.shopItem .hatPreview{width:52px;text-align:center;flex:none}
.shopItem button{width:auto;min-width:112px;margin:0;padding:10px 12px;font-size:13px;white-space:nowrap}
.shopItem button:disabled{opacity:.55}
#settingsModal{display:none;position:fixed;inset:0;z-index:31;align-items:center;justify-content:center;background:#06150fc9;padding:20px}

.settingsCard h2{margin:0 0 8px;color:#fff2a1;font-size:25px}
.colourGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.colourChoice{padding:10px 5px;border:2px solid #ffffff55;border-radius:14px;background:#ffffff18;color:white;box-shadow:none;font-size:12px}
.colourChoice.selected{border-color:#fff36b;background:#ffffff35;box-shadow:0 0 0 2px #fff36b55}
.colourDot{display:block;width:34px;height:34px;margin:0 auto 6px;border-radius:50%;border:2px solid #ffffffaa}
.settingsCard button{width:100%;margin:5px 0}
.settingsCard .shopClose{background:#e7eee2;box-shadow:0 4px 0 #9aa99a}

#accountOpen,#leaderboardOpen{
 position:fixed;right:14px;z-index:20;padding:10px 13px;
 border:2px solid #b7e58a;border-radius:14px;
 background:#183b30;color:#fff2a1;font-weight:bold;
 box-shadow:0 3px 0 #5d9632
}
#accountOpen{top:calc(72px + env(safe-area-inset-top,0px))}
#leaderboardOpen{top:calc(126px + env(safe-area-inset-top,0px))}
.paathu-overlay{
 display:none;position:fixed;inset:0;z-index:60;
 background:#06150fdd;align-items:center;justify-content:center;padding:16px
}
.paathu-card{
 width:min(92vw,390px);max-height:86vh;overflow:auto;
 background:linear-gradient(160deg,#315f3c,#183b30);
 border:2px solid #b7e58a;border-radius:22px;
 padding:22px;color:white;text-align:center
}
.paathu-card h2{color:#fff2a1;margin-top:0}
.paathu-card input{
 display:block;width:100%;box-sizing:border-box;margin:10px 0;
 padding:13px;border-radius:10px;border:1px solid #b7e58a;
 background:#fff;color:#18251c;font-size:16px
}
.paathu-card button{
 width:100%;padding:12px;margin:5px 0;border:0;
 border-radius:12px;font-weight:bold;font-size:15px
}
.paathu-primary{background:#fff2a1;color:#183b30}
.paathu-secondary{background:#e7eee2;color:#183b30}
#paathuMessage{font-size:13px;overflow-wrap:anywhere}
#paathuLeaderboard{text-align:left}
.paathu-rank{padding:10px;border-bottom:1px solid #ffffff33}
</style>
</head>

  <div id="shopItems"></div>
  <button id="shopClose" class="shopClose">CLOSE</button>

 </div>
</div>
<div id="settingsModal">
 <div class="settingsCard">
  <h2>⚙️ PAATHU SETTINGS</h2>
  <div class="shopBalance">Choose Paathu's colour</div>
  <div id="colourGrid" class="colourGrid"></div>
  <div id="goldColourAction"></div>
  <button id="settingsAccountButton" class="shopClose">👤 ACCOUNT / LOGIN</button>
  <button id="settingsClose" class="shopClose">CLOSE</button>
 </div>
</div>
<button id="accountOpen">👤 ACCOUNT</button>
<button id="leaderboardOpen">🏆 RANKINGS</button>

<div id="accountModal" class="paathu-overlay">
 <div class="paathu-card">
  <h2>PAATHU ACCOUNT</h2>
  <p id="paathuAccountStatus">Playing as guest</p>
  <input id="paathuUsername" placeholder="Username (registration)" maxlength="20">

  <button id="paathuAccountClose" class="paathu-secondary">CLOSE</button>
 </div>
</div>

<div id="leaderboardModal" class="paathu-overlay">
 <div class="paathu-card">

  <button id="paathuLeaderboardClose" class="paathu-secondary">CLOSE</button>
 </div>
</div>
<div id="controls">
 <div class="pad"><button data-move="left">◀</button><button data-move="right">▶</button></div>
 <div class="pad"><button data-move="jump">⬆</button><button data-move="slide">⬇</button></div>
</div>
<script type="importmap">

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const mount=document.getElementById('game');
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x83d7f4); scene.fog=new THREE.Fog(0x83d7f4,48,145);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,150); camera.position.set(0,5.0,11.5); camera.lookAt(0,1.15,-6);
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,1.35)); renderer.setSize(innerWidth,innerHeight); renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap; renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.12; mount.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe5ffff,0x34402b,2.0));
const sun=new THREE.DirectionalLight(0xfff1d0,2.8); sun.position.set(-5,12,7); sun.castShadow=true; sun.shadow.mapSize.set(1536,1536); scene.add(sun);
const mat=(color,roughness=.85)=>new THREE.MeshStandardMaterial({color,roughness});
const green=mat(0x54a94c), darkGreen=mat(0x287344), stone=mat(0xa99b82), paleStone=mat(0xd4c6a5), gold=mat(0xffcf42,.38), purple=mat(0xa94be8), lightPurple=mat(0xd58aff), pink=mat(0xffa9ce), white=mat(0xfff8fb), black=mat(0x24152e), hoof=mat(0x49334b), horn=mat(0xc58a4c), mouth=mat(0x7b3650);
const box=(w,h,d,m,x,y,z)=>{let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o};
const sphere=(r,m,x,y,z,sx=1,sy=1,sz=1)=>{let o=new THREE.Mesh(new THREE.SphereGeometry(r,16,12),m);o.position.set(x,y,z);o.scale.set(sx,sy,sz);o.castShadow=true;scene.add(o);return o};
const cyl=(rt,rb,h,m,x,y,z,seg=10)=>{let o=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),m);o.position.set(x,y,z);o.castShadow=true;scene.add(o);return o};

// PAATHU FOREST: a winding-looking woodland trail with distant mountain ranges.
scene.background=new THREE.Color(0x9bdcf4);
scene.fog=new THREE.Fog(0x9bdcf4,58,165);
const ground=box(180,.7,145,mat(0x4b914b),0,-.55,-48);
const forestFloor=box(34,.12,145,mat(0x5eaa55),0,-.13,-48);
// Soft dirt running path, with grassy shoulders.
const path=box(7.5,.16,145,mat(0xb58b59),0,-.02,-48);
const pathEdgeMat=mat(0x80613f);
box(.16,.08,145,pathEdgeMat,-3.82,.055,-48);
box(.16,.08,145,pathEdgeMat,3.82,.055,-48);
// Distant mountain layers: broad overlapping peaks create a scenic horizon.
const mountainMats=[mat(0x789b9c),mat(0x668b83),mat(0x557b70),mat(0x8ca9a4)];
for(let i=0;i<13;i++){
 const x=-65+i*10.8, h=17+(i%4)*5, r=13+(i%3)*3;
 const peak=new THREE.Mesh(new THREE.ConeGeometry(r,h,5),mountainMats[i%mountainMats.length]);
 peak.position.set(x,h*.42,-91-(i%3)*8);peak.rotation.y=(i%2)*.4;scene.add(peak);
 // Pale rocky cap on taller distant peaks.
 if(h>27){const cap=new THREE.Mesh(new THREE.ConeGeometry(r*.32,h*.25,5),mat(0xe2eee8));cap.position.set(x,h*.82,-91-(i%3)*8);scene.add(cap);}
}
// Forested foothills in front of the mountains.
for(let i=0;i<17;i++){
 const hill=new THREE.Mesh(new THREE.SphereGeometry(1,16,12),mat(i%2?0x4b8757:0x60935b));
 hill.scale.set(9+(i%3)*3,5+(i%4),5);hill.position.set(-72+i*9,1.2,-62-(i%3)*5);scene.add(hill);
}
// Pine tree builder; each tree is a grouped trunk and layered green canopy.
const roadsideProps=[];
const pineMats=[mat(0x174f35),mat(0x206b3d),mat(0x2c8248),mat(0x3a9250)];
const trunkMat=mat(0x765039), rockMats=[mat(0x777d70),mat(0x929487),mat(0x665f54)];
function makePine(group,height,variant=0){
 const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.13,.22,height*.48,7),trunkMat);
 trunk.position.y=height*.24;group.add(trunk);
 for(let k=0;k<3;k++){
   const radius=height*(.31-k*.055), tierH=height*.48;
   const crown=new THREE.Mesh(new THREE.ConeGeometry(radius,tierH,7),pineMats[(variant+k)%pineMats.length]);
   crown.position.y=height*.38+k*height*.22;group.add(crown);
 }
}
for(let side of [-1,1]){
 for(let i=0;i<13;i++){
   const group=new THREE.Group(),z=-i*10-8;
   const x=side*(7.2+(i%3)*2.0);
   group.position.set(x,0,z);
   const h=5.5+(i%4)*1.35;makePine(group,h,i);
   // A smaller companion pine makes the forest feel dense, not like a row of props.
   const small=new THREE.Group();small.position.set(side*-2.0,0,1.8);makePine(small,h*.62,i+1);group.add(small);
   const rock=new THREE.Mesh(new THREE.DodecahedronGeometry(.7+(i%3)*.18,0),rockMats[i%rockMats.length]);
   rock.position.set(side*1.4,.35,-1.1);rock.scale.set(1.3,.7,1);group.add(rock);
   scene.add(group);roadsideProps.push({group,initialZ:z,phase:i*.5+side});
 }
}
// Small trail stones and tufts scroll toward the runner.
const trackScroll=[];
for(let z=5;z>-122;z-=4.5){
 const stone=new THREE.Mesh(new THREE.DodecahedronGeometry(.11,0),mat(0x8c765a));
 stone.position.set((Math.random()-.5)*5.8,.09,z);stone.scale.set(1.5,.45,.8);scene.add(stone);trackScroll.push(stone);
}
const laneDashes=[];
for(let z=4;z>-112;z-=7){
 const dash=new THREE.Group();dash.position.z=z;
 for(let x of [-1.55,1.55]){
   const tuft=new THREE.Mesh(new THREE.ConeGeometry(.12,.34,5),pineMats[2]);
   tuft.position.set(x,.18,0);dash.add(tuft);
 }
 scene.add(dash);laneDashes.push(dash);
}
// Open sky and soft clouds above the mountain ridge.
const overhead=[];
const clouds=[];
for(let i=0;i<5;i++){
 const cloud=new THREE.Group();cloud.position.set((i%2?1:-1)*(13+(i%3)*7),13+(i%2)*2,-38-i*19);
 for(let j=0;j<5;j++){
   const puff=new THREE.Mesh(new THREE.SphereGeometry(1.15,12,10),new THREE.MeshBasicMaterial({color:0xffffff}));
   puff.position.set((j-2)*.85,(j%2)*.28,0);puff.scale.set(1.25,.72,.9);cloud.add(puff);
 }
 scene.add(cloud);clouds.push(cloud);
}
// Paathu: use a real, lightweight rigged goat model instead of the old pile of spheres.
const goat=new THREE.Group(); scene.add(goat); goat.position.set(0,0,3);
const goatModelRoot=new THREE.Group();goat.add(goatModelRoot);
function makeHatGroup(){const g=new THREE.Group();g.position.set(0,-.30,-.55);g.visible=false;goatModelRoot.add(g);return g;}
const christmasHat=makeHatGroup();
const hatBrim=new THREE.Mesh(new THREE.CylinderGeometry(.43,.43,.12,20),mat(0xf6f2e8));
hatBrim.position.y=2.43;christmasHat.add(hatBrim);
const hatCone=new THREE.Mesh(new THREE.ConeGeometry(.34,.78,16),mat(0xc92f3b));
hatCone.position.set(0,2.84,-.04);hatCone.rotation.z=-.12;christmasHat.add(hatCone);
const hatPom=new THREE.Mesh(new THREE.SphereGeometry(.13,12,10),mat(0xffffff));
hatPom.position.set(-.06,3.24,-.04);christmasHat.add(hatPom);
// British gentleman bowler hat.
const gentlemanHat=makeHatGroup();
const gentlemanBrim=new THREE.Mesh(new THREE.CylinderGeometry(.55,.55,.10,24),mat(0x17191c));
gentlemanBrim.position.y=2.48;gentlemanHat.add(gentlemanBrim);
const gentlemanCrown=new THREE.Mesh(new THREE.CylinderGeometry(.34,.39,.55,24),mat(0x202328));
gentlemanCrown.position.y=2.78;gentlemanHat.add(gentlemanCrown);
const gentlemanBand=new THREE.Mesh(new THREE.CylinderGeometry(.395,.395,.09,24),mat(0x9b2430));
gentlemanBand.position.y=2.57;gentlemanHat.add(gentlemanBand);
// NYPD-style navy police cap with a gold badge.
const policeHat=makeHatGroup();
const policeBrim=new THREE.Mesh(new THREE.BoxGeometry(.88,.09,.57),mat(0x111e3b));
policeBrim.position.set(0,2.48,-.08);policeHat.add(policeBrim);
const policeCrown=new THREE.Mesh(new THREE.SphereGeometry(.39,20,12),mat(0x17294d));
policeCrown.scale.set(1,.65,.88);policeCrown.position.set(0,2.70,-.02);policeHat.add(policeCrown);
const policeBadge=new THREE.Mesh(new THREE.CircleGeometry(.105,6),mat(0xf2c54b));
policeBadge.position.set(0,2.72,.335);policeBadge.rotation.y=0;policeHat.add(policeBadge);
let goatMixer=null, goatModel=null, goatLegNodes=[], goatPartsByName={}, goatCoatMaterials=[];
const head=new THREE.Group(), tail=new THREE.Group(), legs=[];
const goatLoader=new GLTFLoader();
goatLoader.load(
 'https://polyfork.dev/cdn/goat-base.glb',
 (gltf)=>{
   goatModel=gltf.scene;
   // The asset is authored in metres; size it to match the runner's lane scale.
   goatModel.scale.setScalar(1.42);
   goatModel.rotation.y=Math.PI;
   goatModel.position.set(0,0,0);
   goatModel.traverse((node)=>{
     if(!node.isMesh)return;
     node.castShadow=true;node.receiveShadow=true;
     const mats=Array.isArray(node.material)?node.material:[node.material];
     for(const material of mats){
       if(!material)continue;
       if(material.color){
         // The supplied goat asset uses a shared coat palette. Keep a handle so
         // the settings menu can recolour it without reloading the model.
         if(!goatCoatMaterials.includes(material))goatCoatMaterials.push(material);

function start(){
 reset();running=false;document.body.classList.remove('playing');
 title.classList.add('story-mode');document.body.classList.add('story-intro');
 title.querySelector('h1').textContent='A QUIET FOREST...';

 const started=performance.now();last=started;
 let storyFinished=false;
 function reveal(now){
   if(storyFinished || title.style.display==='none')return;
   const elapsed=now-started;
   if(elapsed<2700){
     title.querySelector('h1').textContent='A QUIET FOREST...';
     document.getElementById('titleSub').textContent='Paathu wanders along a peaceful mountain trail.';
     hunter.visible=false;
   }else if(elapsed<5600){
     title.querySelector('h1').textContent='A SNAP IN THE TREES!';
     document.getElementById('titleSub').textContent='Something is following Paathu through the forest...';
     hunter.visible=true;
     hunter.position.set(0,0,8.2-(elapsed-2700)*.00035);
     hunter.rotation.y=Math.sin(elapsed*.001)*.08;
   }else if(elapsed<7600){
     title.querySelector('h1').textContent='THE HUNTER!';
     document.getElementById('titleSub').textContent='Run, Paathu! Swipe to dodge, jump and slide.';
     hunter.visible=true;
     hunter.position.set(0,0,6.9);
   }else{
     storyFinished=true;finishStory();return;
   }
   requestAnimationFrame(reveal);
 }
 document.getElementById('storySkip').onclick=()=>{if(!storyFinished){storyFinished=true;finishStory();}};
 requestAnimationFrame(reveal);
}

 if(running){
 // Road markings and scenery stream toward the goat to sell forward motion.
 for(const dash of laneDashes){dash.position.z+=speed*dt;if(dash.position.z>8)dash.position.z-=115;}

 tail.rotation.x=Math.sin(t*.018)*.28;
 // The Hunter only appears briefly now and then, like a distant pursuer.

 if(hunterPhase==='hidden'){
   hunter.visible=false;hunterCooldown-=dt;

 }else{

 }
 if(goatMixer)goatMixer.update(dt);
 if(goatModel){

 }
 score+=dt*speed*.65;
 // Difficulty rises in clear 500m stages rather than accelerating constantly.
 const stage=Math.floor(score/300);
 speed=Math.min(27,15+stage*.8);
 scoreEl.textContent=Math.floor(score);
 goat.position.x=THREE.MathUtils.damp(goat.position.x,[-1.5,0,1.5][lane],16,dt);

 if(Math.random()<dt*.12){let wl=Math.floor(Math.random()*3);addObstacle(wl,-82,'water')}

 for(let i=moving.length-1;i>=0;i--){let o=moving[i];o.position.z+=speed*dt;if(o.userData.type==='coin')o.rotation.y+=dt*3;

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const db = createClient(
 'https://pthtqtfsmnfiduhgigfa.supabase.co',
 'sb_publishable_uiq-9KUkV1AMGgGZ7Zf2Xg_RnMZM3Jx'
);

const el = id => document.getElementById(id);
let currentUser = null;

function showMessage(message) {
 el('paathuMessage').textContent = message;
}

function updateAccount() {
 const username = currentUser?.user_metadata?.username || currentUser?.email || '';
 el('paathuAccountStatus').textContent = currentUser ? 'Logged in as @' + username : 'Playing as guest';
 el('paathuLogout').style.display = currentUser ? 'block' : 'none';

 el('paathuIdentity').style.display = 'block';

async function refreshAccount() {
 const {data,error} = await db.auth.getSession();
 if (error) showMessage(error.message);
 currentUser = data?.session?.user || null;
 updateAccount();
}

el('accountOpen').addEventListener('click', async () => {
 await refreshAccount();
 el('accountModal').style.display = 'flex';
 showMessage('');
});

el('paathuAccountClose').addEventListener('click', () => {
 el('accountModal').style.display = 'none';

 el('accountModal').style.display = 'none';

el('paathuRegister').addEventListener('click', async () => {
 const email = el('paathuEmail').value.trim();
 const password = el('paathuPassword').value;
 const username = el('paathuUsername').value.trim();

 if (!email || password.length < 8 ||
     !/^[a-zA-Z0-9_]{3,20}$/.test(username)) {
  showMessage('Enter a valid email, password (8+ characters) and username (3–20 letters, numbers or _).');
  return;
 }

 showMessage('Creating account...');

 const {data,error} = await db.auth.signUp({
  email,
  password,
  options:{data:{username},emailRedirectTo:'https://pthtqtfsmnfiduhgigfa.supabase.co'}
 });

 if (error) {
  showMessage(error.message);
  return;
 }

 currentUser = data.session ? data.user : null;
 updateAccount();

 showMessage(data.session
  ? 'Account created! You are logged in.'

});

window.PaathuAccount = {
 async submitBestRun(distance) {
  if(!currentUser || !Number.isFinite(distance) || distance<0) return;
  const {data:existing,error:readError}=await db.from('best_runs').select('best_distance').eq('user_id',currentUser.id).maybeSingle();
  if(readError){console.warn('Could not read previous best run',readError);return;}
  const best=Math.max(Math.floor(distance),Number(existing?.best_distance)||0);
  if(best <= (Number(existing?.best_distance)||0)) return;
  const {error}=await db.from('best_runs').upsert({user_id:currentUser.id,best_distance:best,updated_at:new Date().toISOString()},{onConflict:'user_id'});
  if(error) console.warn('Best run upload failed',error); else console.info('Best run submitted',best);
 }
};

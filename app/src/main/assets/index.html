<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>PAATHU RUN</title>
<style>
:root{--g:#a9e85e;--gd:#5d9632;--p:#7138a0;--y:#fff36b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#123;font:700 16px system-ui,sans-serif;color:#fff;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center;transition:opacity .5s,transform .5s;background:radial-gradient(#0000 35%,#0b1630b0)}
.screen.hide{opacity:0;pointer-events:none;transform:scale(1.08)}
h1{margin:0;font:900 clamp(44px,13vw,72px)/1 system-ui;color:var(--y);-webkit-text-stroke:2px var(--p);text-shadow:0 5px 0 var(--p),0 10px 22px #0007;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-1.5deg)}}
.big{font-size:64px;animation:bob 1.6s ease-in-out infinite}
button{border:0;border-radius:16px;background:var(--g);color:#14200d;font:900 18px system-ui;padding:13px 26px;box-shadow:0 5px 0 var(--gd);transition:transform .1s}
button:active{transform:translateY(3px);box-shadow:0 2px 0 var(--gd)}
button:disabled{opacity:.5}
button.s{background:#e7eee2;box-shadow:0 4px 0 #9aa99a;font-size:15px;padding:10px 18px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.pill{background:#0b1630a6;border:1px solid #fff4;border-radius:18px;padding:6px 14px;backdrop-filter:blur(6px)}
#hud{position:fixed;z-index:5;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;transition:opacity .4s}
#hud.hide{opacity:0}#hud button{pointer-events:auto;padding:6px 12px;font-size:17px;box-shadow:none}
#dist{font:900 26px system-ui}
#toast{position:fixed;z-index:6;top:24%;width:100%;text-align:center;font:900 30px system-ui;text-shadow:0 3px 0 #0006,0 0 14px #000a;pointer-events:none;opacity:0;transform:scale(.7);transition:.25s}
#toast.on{opacity:1;transform:scale(1)}
#flash{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0;background:#f33;transition:opacity .4s}
.card{width:min(92vw,380px);max-height:86vh;overflow:auto;padding:20px;border-radius:24px;background:linear-gradient(160deg,#315f3c,#183b30);border:2px solid #b7e58a;box-shadow:0 15px 50px #0008}
.card h2{margin:0 0 10px;color:#fff2a1}
.item{display:flex;align-items:center;gap:10px;padding:10px 12px;margin:8px 0;border-radius:16px;background:#ffffff18;text-align:left}
.item button{font-size:13px;padding:9px 12px;min-width:92px}
.dots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.dots button{background:#ffffff18;color:#fff;box-shadow:none;font-size:12px;padding:8px 4px;border:2px solid #fff5}
.dots .sel{border-color:var(--y)}
.dot{display:block;width:32px;height:32px;margin:0 auto 4px;border-radius:50%;border:2px solid #fffa}
input{user-select:text;-webkit-user-select:text}
.card input{display:block;width:100%;margin:8px 0;padding:12px;border-radius:10px;border:1px solid #b7e58a;background:#fff;color:#18251c;font:16px system-ui}
.rk{padding:8px;border-bottom:1px solid #fff3}
#hw{position:fixed;z-index:6;top:30%;left:0;right:0;margin:auto;width:max-content;max-width:94vw;background:#d0202acc;border:2px solid #fff;border-radius:16px;padding:10px 16px;font:900 16px system-ui;display:none;animation:bob .5s infinite}
</style></head><body>
